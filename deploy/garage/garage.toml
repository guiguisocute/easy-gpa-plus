# Garage 开发环境配置(compose 挂载到 /etc/garage.toml)
# ⚠ rpc_secret / admin_token 是开发专用值;生产必须重新生成并通过外部配置目录注入
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "0101010101010101010101010101010101010101010101010101010101010101"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "easygpa-dev-admin-token"
