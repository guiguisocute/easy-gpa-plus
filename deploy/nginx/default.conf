limit_req_zone $binary_remote_addr zone=easygpa_api_rate:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=easygpa_api_connections:10m;

server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16m;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;
    server_tokens off;
    limit_req_status 429;
    limit_conn_status 429;

    location = /frontend-healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Keep API and refresh-token cookies same-origin in container deployments.
    location ~ ^/(api/|mcp(?:/|$)) {
        client_max_body_size 64m;
        # This deliberately keys on the immediate network peer. Behind a
        # tunnel/CDN it becomes a generous aggregate circuit breaker; the API
        # applies the lower per-client and per-session limits.
        limit_req zone=easygpa_api_rate burst=200 nodelay;
        limit_conn easygpa_api_connections 100;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 20s;
        proxy_read_timeout 60s;
        proxy_request_buffering on;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Shared immutable files also serve already-open pages after deployment.
    location ^~ /assets/ {
        root /var/cache/easygpa;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; connect-src 'self' http: https:; font-src 'self' data:;" always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|webp|woff2)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; connect-src 'self' http: https:; font-src 'self' data:;" always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        # script-src 的 sha256 是 index.html 里那段“挂载前定色”内联脚本。没有它，
        # CSP 会静默拦掉这段脚本，readTheme() 读不到 data-theme，深色偏好每次刷新
        # 都退回浅色。哈希由 frontend/src/lib/csp.test.ts 与 index.html 保持同步。
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'sha256-VNCzwpEHWY2D/+iLGHxdTW3xF60nzR71IVQUGiyDzQc='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; connect-src 'self' http: https:; font-src 'self' data:;" always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
