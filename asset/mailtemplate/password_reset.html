<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找回密码 · EasyGPA Plus</title>
</head>

<body style="margin:0;padding:0;background-color:#fafafa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',system-ui,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#fafafa;padding:40px 16px;">
        <tr>
            <td align="center">
                <table width="560" cellpadding="0" cellspacing="0" border="0"
                    style="background-color:#ffffff;border:1px solid #e3e3e3;">

                    <!-- brand header -->
                    <tr>
                        <td style="padding:22px 36px;border-bottom:1px solid #efefef;">
                            <table cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <!-- easygpa-brand-mark -->
                                    <td style="vertical-align:middle;">
                                        <p style="margin:0;font-size:13px;font-weight:600;color:#0a0a0a;letter-spacing:-0.025em;line-height:1.2;">
                                            EasyGPA Plus
                                        </p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- body -->
                    <tr>
                        <td style="padding:36px 36px 28px;">

                            <p style="margin:0 0 14px;font-family:Consolas,'SF Mono',Menlo,monospace;font-size:10px;font-weight:500;letter-spacing:0.2em;color:#8e8e8e;">
                                RESET PASSWORD
                            </p>

                            <p style="margin:0 0 10px;font-size:28px;font-weight:600;color:#0a0a0a;letter-spacing:-0.04em;line-height:1.15;">
                                找回密码
                            </p>

                            <p style="margin:0 0 28px;font-size:13.5px;color:#575757;line-height:1.65;">
                                你好，我们收到了你的找回密码请求。请在 {{expire_minutes}} 分钟内点击下方按钮设置新密码；链接过期后需重新发起申请。
                            </p>

                            <!-- cta block -->
                            <table width="100%" cellpadding="0" cellspacing="0" border="0" style="border-top:1px solid #efefef;border-bottom:1px solid #efefef;">
                                <tr>
                                    <td style="padding:28px 0;text-align:center;">
                                        <p style="margin:0 0 16px;font-family:Consolas,'SF Mono',Menlo,monospace;font-size:9.5px;font-weight:500;letter-spacing:0.16em;color:#8e8e8e;">
                                            ACTION
                                        </p>
                                        <a href="https://gpa.example.org/?reset_token={{reset_token}}"
                                            style="display:inline-block;padding:12px 28px;background-color:#d6001c;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;letter-spacing:-0.02em;line-height:1.2;">
                                            重置密码
                                        </a>
                                        <p style="margin:18px 0 0;font-size:12px;color:#8e8e8e;line-height:1.6;word-break:break-all;">
                                            若按钮无法打开，请复制链接到浏览器：<br>
                                            <a href="https://gpa.example.org/?reset_token={{reset_token}}" style="color:#d6001c;text-decoration:none;">https://gpa.example.org/?reset_token={{reset_token}}</a>
                                        </p>
                                    </td>
                                </tr>
                            </table>

                            <p style="margin:28px 0 10px;font-size:13px;color:#575757;line-height:1.65;">
                                如非本人操作，请忽略本邮件，你的密码不会被修改。
                            </p>
                            <p style="margin:0;font-size:13px;color:#575757;line-height:1.65;">
                                请勿将重置链接转发给他人。
                            </p>
                        </td>
                    </tr>

                    <!-- footer -->
                    <tr>
                        <td style="padding:20px 36px 28px;border-top:1px solid #efefef;">
                            <p style="margin:0 0 10px;font-size:12.5px;color:#8e8e8e;line-height:1.5;">
                                EasyGPA Plus · 综测统计平台
                            </p>
                            <p style="margin:0;font-size:12px;color:#8e8e8e;line-height:1.6;">
                                如有疑问，可访问 <a href="https://gpa.example.org/"
                                    style="color:#d6001c;text-decoration:none;">https://gpa.example.org</a>
                            </p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>

</html>
