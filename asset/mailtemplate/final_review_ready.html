<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>整表终审已完成 · EasyGPA Plus</title>
</head>
<body style="margin:0;padding:0;background:#fafafa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',system-ui,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="padding:40px 16px;background:#fafafa;"><tr><td align="center">
<table width="560" cellpadding="0" cellspacing="0" border="0" style="background:#fff;border:1px solid #e3e3e3;">
    <tr><td style="padding:22px 36px;border-bottom:1px solid #efefef;font-size:13px;font-weight:600;color:#0a0a0a;">EasyGPA Plus</td></tr>
    <tr><td style="padding:36px;">
        <p style="margin:0 0 14px;font:500 10px Consolas,monospace;letter-spacing:.2em;color:#8e8e8e;">FINAL REVIEW READY</p>
        <h1 style="margin:0 0 10px;font-size:28px;line-height:1.15;color:#0a0a0a;">{{audience_label}}</h1>
        <p style="margin:0 0 24px;font-size:13.5px;line-height:1.7;color:#575757;">你好 {{name}}，{{student_name}} 的单项初审、裁定及整表独立复核已经汇总为本轮终审结果。</p>
        <table width="100%" cellpadding="0" cellspacing="0" style="border-top:1px solid #efefef;border-bottom:1px solid #efefef;">
            <tr><td style="padding:18px 0;"><p style="margin:0 0 5px;font-size:12px;color:#8e8e8e;">终审完成时间</p><p style="margin:0;font-size:16px;font-weight:600;color:#0a0a0a;">{{completed_at}}</p></td></tr>
            <tr><td style="padding:0 0 18px;"><p style="margin:0 0 5px;font-size:12px;color:#8e8e8e;">结果确认截止</p><p style="margin:0;font-size:16px;font-weight:600;color:#d6001c;">{{confirmation_deadline}}</p></td></tr>
        </table>
        <p style="margin:24px 0 0;font-size:13px;line-height:1.7;color:#575757;">{{confirmation_guidance}}</p>
        <p style="margin:12px 0 0;font-size:12.5px;line-height:1.7;color:#8e8e8e;">终审完成与最终结算是两个阶段：结算总分、班级名次和荣誉结果会在班级结算完成后另行通知。</p>
        <p style="margin:28px 0 0;text-align:center;"><a href="https://gpa.example.org/" style="display:inline-block;padding:12px 28px;background:#d6001c;color:#fff;text-decoration:none;font-size:14px;font-weight:600;">核对终审结果</a></p>
    </td></tr>
    <tr><td style="padding:20px 36px 28px;border-top:1px solid #efefef;font-size:12px;color:#8e8e8e;">{{class_name}} · https://gpa.example.org</td></tr>
</table></td></tr></table>
</body>
</html>
